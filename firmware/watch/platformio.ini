; claude-remote watch firmware.
;   pio test -e native      host unit tests for lib/watchcore (no hardware)
;   pio run  -e twatch-s3   build for the LilyGO T-Watch S3 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM)
[platformio]
default_envs = twatch-s3

[env]
lib_deps =
  bblanchon/ArduinoJson@^7.2.1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
build_src_filter = -<*>

[env:twatch-s3]
platform = espressif32@6.9.0
board = lilygo-t-watch-s3
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  ; Serial over the watch's USB-C port (native USB CDC), used for provisioning
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  ; TFT_eSPI setup, from LilyGO's Setup212_LilyGo_T_Watch_S3.h
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_INVERSION_ON=1
  -DTFT_MISO=-1
  -DTFT_MOSI=13
  -DTFT_SCLK=18
  -DTFT_CS=12
  -DTFT_DC=38
  -DTFT_RST=-1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  ; uncomment to allow ws:// relays on a trusted LAN during development
  ; -DWATCH_ALLOW_INSECURE_WS=1
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@2.5.43
  lewisxhe/XPowersLib@0.2.4
  lewisxhe/SensorLib@0.1.8
  links2004/WebSockets@^2.6.1
