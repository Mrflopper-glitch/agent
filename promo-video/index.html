<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northvane Promo</title>
<style>
@font-face{font-family:'Inter Tight';font-weight:500;src:url(node_modules/@fontsource/inter-tight/files/inter-tight-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:600;src:url(node_modules/@fontsource/inter-tight/files/inter-tight-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:700;src:url(node_modules/@fontsource/inter-tight/files/inter-tight-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:800;src:url(node_modules/@fontsource/inter-tight/files/inter-tight-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:900;src:url(node_modules/@fontsource/inter-tight/files/inter-tight-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:800;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-800-normal.woff2) format('woff2')}

*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none;overflow:hidden;background:var(--bg)}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.fill{position:absolute;inset:0}

/* background texture */
.grid{position:absolute;inset:-160px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px}
.glow{position:absolute;width:1600px;height:1600px;border-radius:50%;left:0;top:0;margin:-800px 0 0 -800px;background:radial-gradient(circle,rgba(var(--gain-rgb),.15) 0%,rgba(var(--gain-rgb),.05) 35%,rgba(var(--gain-rgb),0) 62%)}
.glow.gold{background:radial-gradient(circle,rgba(var(--gold-rgb),.13) 0%,rgba(var(--gold-rgb),.04) 35%,rgba(var(--gold-rgb),0) 62%)}
#grain{position:absolute;inset:-64px;pointer-events:none;opacity:.045;z-index:50}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.42) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:48}

/* type */
.slam{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;letter-spacing:-.045em;word-spacing:.08em;line-height:.88;text-transform:uppercase;transform-origin:50% 50%}
.kicker{font-family:'JetBrains Mono';font-weight:600;font-size:28px;letter-spacing:.14em;color:var(--gain);text-transform:uppercase;white-space:nowrap}
.kicker .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--gain);margin-right:16px;vertical-align:1px}
.headline{font-weight:800;font-size:124px;letter-spacing:-.045em;line-height:.98;white-space:nowrap}
.line{display:block;overflow:hidden;padding:0 .04em .08em 0;margin-bottom:-.08em}
.line>span{display:inline-block;will-change:transform}
.hl{color:var(--gain)}
.goldc{color:var(--gold)}
.dim{color:var(--text2)}
.mono{font-family:'JetBrains Mono';font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.copyblock{position:absolute;top:50%;transform:translateY(-50%)}
.copyblock .kicker{margin-bottom:34px}

/* phone */
.phone{position:absolute;left:0;top:0;width:430px;height:932px;margin:-466px 0 0 -215px;transform-origin:50% 50%}
.phone .pglow{position:absolute;left:50%;top:50%;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;background:radial-gradient(circle,rgba(var(--gain-rgb),.22) 0%,rgba(var(--gain-rgb),.07) 30%,rgba(var(--gain-rgb),0) 60%);pointer-events:none}
.phone .body{position:absolute;inset:0;border-radius:72px;background:linear-gradient(150deg,#3a404c 0%,#14171d 18%,#0a0b0f 50%,#14171d 82%,#2f343f 100%);padding:3px;box-shadow:0 60px 140px rgba(0,0,0,.65),0 0 0 1.5px rgba(255,255,255,.24)}
.phone .bezel{position:absolute;inset:3px;border-radius:69px;background:#010102}
.phone .screen{position:absolute;inset:13px;border-radius:58px;overflow:hidden;background:#07090D}
.phone .island{position:absolute;top:24px;left:50%;width:122px;height:35px;margin-left:-61px;background:#000;border-radius:20px;z-index:20}
.phone .sheen{position:absolute;inset:13px;border-radius:58px;pointer-events:none;z-index:21;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 100%)}
.sbar{position:absolute;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 44px;font-weight:700;font-size:17px;z-index:15}
.sbar .ic{display:flex;gap:6px;align-items:center}
.scr{position:absolute;top:58px;left:0;right:0;bottom:0;padding:6px 18px 0}

/* app ui */
.hdr{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}
.ttl{font-size:34px;font-weight:800;letter-spacing:-.035em}
.sub{font-size:15px;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:6px;margin-top:4px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{height:38px;padding:0 16px;border-radius:19px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;font-size:15px;font-weight:700;color:var(--text2)}
.chip.on{background:var(--gain);color:var(--onGain);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:-.02em;flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.28)}
.tk{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.01em;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.nm{font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.tg{font-size:14px;color:var(--text2);font-weight:600;margin-top:3px}
.feat{padding:16px 16px 12px;margin-bottom:12px}
.feat .top{display:flex;align-items:center;gap:12px}
.btn{height:40px;padding:0 18px;border-radius:20px;background:var(--text);color:#05060A;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap}
.btn.on{background:var(--gain);color:var(--onGain)}
.feat .val{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.feat .val .mono{font-size:30px;font-weight:700}
.up{color:var(--gain);font-weight:700}
.down{color:var(--loss);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:9px;height:76px}
.row .r{margin-left:auto;text-align:right}
.row .r .mono{font-size:17px;font-weight:700}
.row .r .up,.row .r .down{font-size:14px;margin-top:3px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:rgba(10,12,17,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:12px}
.tabbar .t{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#7d8696}
.tabbar .t.on{color:var(--gain)}

.nav{display:flex;align-items:center;gap:10px;margin:2px 0 18px}
.pill{height:34px;padding:0 14px;border-radius:17px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;margin-left:auto}
.pill.on{background:rgba(var(--gain-rgb),.14);color:var(--gain);box-shadow:inset 0 0 0 1px rgba(var(--gain-rgb),.4)}
.lbl{font-size:15px;color:var(--text2);font-weight:600}
.bigv{font-size:42px;font-weight:700;margin:4px 0 4px}
.chg{font-size:16px}
.ranges{display:flex;justify-content:space-between;margin:6px 4px 18px}
.ranges span{font-size:14px;font-weight:800;color:var(--text2);padding:7px 13px;border-radius:12px}
.ranges span.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.sec b{font-size:21px;letter-spacing:-.02em}
.sec span{font-size:14px;color:var(--text2);font-weight:600}
.hrow{display:flex;align-items:center;gap:12px;height:68px;padding:0 4px;border-bottom:1px solid var(--line)}
.hrow .r{margin-left:auto;text-align:right}
.chgpill{font-family:'JetBrains Mono';font-weight:700;font-size:15px;padding:6px 10px;border-radius:10px}
.chgpill.up{background:rgba(var(--gain-rgb),.13)}
.chgpill.down{background:rgba(255,84,112,.13)}

.live{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;background:rgba(var(--gain-rgb),.14);color:var(--gain);font-weight:800;font-size:14px;font-family:'JetBrains Mono';letter-spacing:.08em}
.live i{width:9px;height:9px;border-radius:50%;background:var(--gain);display:block}
.notif{position:absolute;width:384px;height:96px;border-radius:26px;background:rgba(36,40,50,.94);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;gap:13px;padding:0 16px;box-shadow:0 24px 60px rgba(0,0,0,.55);transform-origin:50% 50%}
.notif .ico{width:46px;height:46px;border-radius:13px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.notif .a{font-size:14px;color:var(--text2);font-weight:700;display:flex;justify-content:space-between;width:100%}
.notif .b{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.notif .b em{font-style:normal;color:var(--gain)}
.arow{position:absolute;left:18px;right:18px;height:84px;display:flex;align-items:center;gap:12px;padding:0 14px}
.arow .txt{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.arow .txt .dim{font-weight:600;font-size:14px}

.sheet{position:absolute;left:0;right:0;bottom:0;height:520px;background:#141822;border-top-left-radius:34px;border-top-right-radius:34px;border-top:1px solid rgba(255,255,255,.14);padding:12px 22px 0;z-index:10}
.grab{width:44px;height:5px;border-radius:3px;background:#3a4150;margin:0 auto 18px}
.sh-ttl{font-size:26px;font-weight:800;letter-spacing:-.03em}
.sh-sub{font-size:15px;color:var(--text2);font-weight:600;margin-top:6px}
.amt{font-size:60px;font-weight:800;text-align:center;margin:26px 0 18px}
.slider{position:relative;height:8px;border-radius:4px;background:#2a303d;margin:0 6px}
.slider .fl{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--gain)}
.slider .kn{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.sh-row{display:flex;justify-content:space-between;font-size:15px;font-weight:600;color:var(--text2);margin:26px 4px 0;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sh-row b{color:var(--text);font-family:'JetBrains Mono'}
.swipe{position:relative;height:68px;border-radius:34px;background:#232937;margin-top:26px;overflow:hidden}
.swipe .sf{position:absolute;left:0;top:0;bottom:0;border-radius:34px;background:var(--gain)}
.swipe .sk{position:absolute;top:6px;left:6px;width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.swipe .sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--text2)}
.swipe .sd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:19px;color:var(--onGain);opacity:0}

.touch{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.34);border:2px solid rgba(255,255,255,.75);z-index:30;opacity:0}
.ripple{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--gain);z-index:29;opacity:0}

.float{position:absolute;display:flex;align-items:center;gap:14px;padding:20px 28px;border-radius:26px;transform-origin:0 50%;background:rgba(19,23,32,.92);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.55);font-weight:800;font-size:26px;letter-spacing:-.02em;white-space:nowrap}

.ctapill{display:inline-flex;align-items:center;gap:18px;height:96px;padding:0 44px;border-radius:48px;background:var(--gain);color:var(--onGain);font-weight:800;font-size:38px;letter-spacing:-.02em;position:relative;overflow:hidden}
.ctapill .shine{position:absolute;top:-20px;bottom:-20px;width:90px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:skewX(-20deg)}
</style>
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
</div>
<script src="brand.js"></script>
<script>
// ---------------------------------------------------------------------------
// Engine: every frame is a pure function of the frame number (seek(f)).
// ---------------------------------------------------------------------------
const FPS = 30, BEAT = 12, BAR = 48, TOTAL = 22 * BAR; // 150 BPM, 1056 frames
const B = n => n * BEAT;
const C = BRAND.color, K = BRAND.copy;
const R = document.documentElement;
for (const [k, v] of Object.entries(C)) R.style.setProperty('--' + k, v);
const rgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(','); };
R.style.setProperty('--gain-rgb', rgb(C.gain));
R.style.setProperty('--gold-rgb', rgb(C.gold));

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {
  lin: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  outBack: t => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
// tween: value at frame f, moving v0->v1 between f0 and f1
const tw = (f, f0, f1, v0, v1, e = E.outExpo) => v0 + (v1 - v0) * e(clamp((f - f0) / (f1 - f0)));
// damped spring 0 -> 1 (with overshoot), f in frames since start
function spring(f, d = 14, s = 170) {
  if (f <= 0) return 0;
  const t = f / FPS, w0 = Math.sqrt(s), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function walk(n, seed, drift = .3, vol = 1) { const r = rng(seed), a = [0]; for (let i = 1; i < n; i++) a.push(a[i - 1] + (r() - .5 + drift * .5) * vol); return a; }
function pathOf(a, w, h, pad = 6) {
  const mn = Math.min(...a), mx = Math.max(...a);
  return a.map((v, i) => `${i ? 'L' : 'M'}${(i / (a.length - 1) * w).toFixed(1)} ${(pad + (1 - (v - mn) / (mx - mn || 1)) * (h - 2 * pad)).toFixed(1)}`).join(' ');
}
const money = v => '$' + Math.round(v).toLocaleString('en-US');
const short = v => '$' + (v >= 1e7 ? (v / 1e6).toFixed(1) : (v / 1e6).toFixed(2)) + 'M';
const initials = n => n.split(' ').map(w => w[0]).join('');
const $ = (el, s) => el.querySelector(s);
const $$ = (el, s) => [...el.querySelectorAll(s)];
function T(e, x = 0, y = 0, s = 1, r = 0, extra = '') { e.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg) ${extra}`; }
const O = (e, v) => { e.style.opacity = v; };

// ---------------------------------------------------------------------------
// Icons + UI components
// ---------------------------------------------------------------------------
const I = {
  check: (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="${C.gain}"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="${C.onGain}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  tick: (s = 18, c = C.onGain) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  search: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${C.text}" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>`,
  bolt: (s = 24, c = '#1a1300') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M13.5 2L4 14h7l-1.5 8L20 10h-7l.5-8z" fill="${c}"/></svg>`,
  chevL: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${C.text}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  arrowR: (c = '#05060A', s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  home: c => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>`,
  compass: c => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="${c}"/></svg>`,
  bell: c => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/></svg>`,
  pie: c => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg>`,
  status: `<svg width="18" height="12" viewBox="0 0 18 12" fill="${C.text}"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
           <svg width="17" height="12" viewBox="0 0 17 12" fill="${C.text}"><path d="M8.5 2.2c2.3 0 4.4.9 6 2.4l1.3-1.3A10.3 10.3 0 008.5.4 10.3 10.3 0 001.2 3.3l1.3 1.3a8.5 8.5 0 016-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.3a6.6 6.6 0 00-9.4 0l1.3 1.3c.9-.8 2.1-1.3 3.4-1.3zm0 3.6c-.4 0-.8.2-1.1.5L8.5 11l1.1-1.1c-.3-.3-.7-.5-1.1-.5z"/></svg>
           <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="${C.text}" stroke-opacity=".45"/><rect x="2.5" y="2.5" width="17" height="8" rx="2" fill="${C.text}"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="${C.text}" fill-opacity=".45"/></svg>`,
};

const world = document.getElementById('world');
const SCENES = [];
const SHAKES = [];   // {f, amp, dur}
const FLASHES = [];  // frame numbers (max 3, DESIGN.md §7)
function scene(o) {
  const el = document.createElement('div');
  el.className = 'scene'; el.id = o.id;
  el.innerHTML = `<div class="cam">${o.html}</div>`;
  world.appendChild(el);
  o.el = el; o.cam = $(el, '.cam'); o.dur = o.to - o.from;
  SCENES.push(o);
  return o;
}
const lines = (arr, cls = '') => arr.map(t => `<span class="line ${cls}"><span>${t}</span></span>`).join('');
function reveal(el, f, starts, dist = 112, len = 10) {
  $$(el, '.line > span').forEach((s, i) => { const st = starts[i] ?? starts[starts.length - 1]; s.style.transform = `translateY(${tw(f, st, st + len, dist, 0)}%)`; });
}
function fitWidth(el, w, maxFs = 2000) {
  el.style.fontSize = '100px';
  const cw = el.getBoundingClientRect().width;
  const fs = Math.min(maxFs, 100 * w / cw);
  el.style.fontSize = fs + 'px';
  return fs;
}
function centerAbs(el, cx, cy) { const r = el.getBoundingClientRect(); el.style.left = (cx - r.width / 2) + 'px'; el.style.top = (cy - r.height / 2) + 'px'; }
// slam punch: scale 1.18 -> 1 over 3 frames + chromatic split for 4 frames
function punch(el, t, base = 1, col = C.text) {
  const s = base * tw(t, 0, 3, 1.18, 1, E.outCubic);
  el.style.transform = `scale(${s})`;
  const dx = t < 4 ? 7 * (1 - t / 4) : 0;
  el.style.textShadow = dx ? `${dx}px 0 rgba(255,40,90,.85), ${-dx}px 0 rgba(0,230,255,.85)` : 'none';
}
function phoneT(el, x, y, s = 1, rz = 0, ry = 0, rx = 0) { el.style.transform = `translate(${x}px,${y}px) perspective(2400px) rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${s})`; }

  let fo = 0; for (const f0 of FLASHES) { const t = F - f0; if (t >= 0 && t < 6) fo = Math.max(fo, .9 * (1 - t / 6)); }

  let sx = 0, sy = 0; for (const k of SHAKES) { const t = F - k.f; if (t >= 0 && t < k.dur) { const a = k.amp * (1 - t / k.dur); sx += (hash(F * 3.1) - .5) * 2 * a; sy += (hash(F * 7.7 + 1) - .5) * 2 * a; } }
  const cover = 1 + Math.max(Math.abs(sx) / 940, Math.abs(sy) / 520) * 1.08;
  world.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${cover.toFixed(4)})`;
  const G = Math.floor(F / 2); // grain at 15 fps: filmic, and compresses far better
  grain.style.transform = `translate(${-Math.floor(hash(G) * 64)}px,${-Math.floor(hash(G + 0.5) * 64)}px)`;
  window.FRAME = F;
}
window.seek = seek; window.TOTAL = TOTAL; window.FPS = FPS;

const FACES = ['500','600','700','800','900'].map(w => `${w} 100px "Inter Tight"`).concat(['500','600','700','800'].map(w => `${w} 100px "JetBrains Mono"`));
Promise.all(FACES.map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
  for (const s of SCENES) { s.el.style.display = 'block'; s.init && s.init(s.el); s.el.style.display = 'none'; }
  seek(0);
  window.READY = true;
  // Preview mode: open index.html directly to watch it loop (with soundtrack if rendered).
  if (!/render/.test(location.search)) {
    const fit = () => { const st = document.getElementById('stage'), k = Math.min(innerWidth / 1920, innerHeight / 1080); st.style.transformOrigin = '0 0'; st.style.transform = `scale(${k})`; };
    fit(); addEventListener('resize', fit);
    const au = new Audio('out/soundtrack.wav'); let t0 = null;
    addEventListener('click', () => { au.currentTime = 0; au.play().catch(() => {}); t0 = performance.now(); });
    const loop = now => { if (t0 === null) t0 = now; const F = ((now - t0) / 1000 * FPS) % TOTAL; seek(F); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
});
</script>
